---
# Role groups (servers / desktops) are maintained by hand here: what a
# machine is *for* can't be derived from facts.
#
# Distro-family groups (arch / fedora / ubuntu) are NOT listed here. site.yml
# derives them at runtime from ansible_os_family via group_by, so a host only
# needs to be put in servers or desktops. group_vars/{arch,fedora,ubuntu}.yml
# are still picked up for those dynamic groups.
#
# Every host, including the machine you run from, is reached over SSH. There
# is deliberately no localhost entry: a whole-inventory run shouldn't touch
# the control node unless it's listed here under its own name. Don't set
# ansible_connection: local on a named host either, or running from another
# machine would configure that machine under this host's name.

all:
  children:
    servers:
      hosts:
        test-server:
          ansible_host: 192.168.122.178
          ansible_ssh_private_key_file: "{{ ansible_config_file | dirname }}/secrets/ssh/testserver"
        # example-server:
        #   ansible_host: 192.0.2.10
        #   ansible_user: nathan

    desktops:
      hosts:
        main-laptop:
          ansible_host: 10.42.10.218
          ansible_ssh_private_key_file: "{{ ansible_config_file | dirname }}/secrets/ssh/main-laptop"
        # example-laptop:
        #   ansible_host: 192.0.2.20
